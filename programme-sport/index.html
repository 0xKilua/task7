    ["Série", "Un bloc de répétitions fait sans s'arrêter. \"4 séries de 10\" = tu fais le mouvement 10 fois, tu te reposes, tu recommences, 4 fois au total."],

    ["Échauffement", "Mouvements légers avant l'effort principal, pour préparer muscles et articulations."],

  // ---------- Stockage : db capability avec repli localStorage ----------

  let logsCol = null;
  let usingLocal = false;
  let allEntries = [];

  function slug(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "-").toLowerCase();
  }

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem("carnet_de_fer_logs") || "[]"); }
    catch (e) { return []; }
  }
  function saveLocal() {
    try { localStorage.setItem("carnet_de_fer_logs", JSON.stringify(allEntries)); } catch (e) {}
  }

  async function initStore() {
    let db = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (db) {
      logsCol = db.collection("logs");
      logsCol.onSnapshot(
        snap => {
          allEntries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderContent();
        },
        () => {
          usingLocal = true;
          allEntries = loadLocal();
          renderContent();
        }
      );
    } else {
      usingLocal = true;
      allEntries = loadLocal();
      renderContent();
    }
    renderFooterNote();
  }

  async function addEntry(entry) {
    if (logsCol && !usingLocal) {
      try { await logsCol.add(entry); return; } catch (e) { /* fall through to local */ }
    }
    allEntries.push({ id: "local-" + Date.now() + "-" + Math.random().toString(36).slice(2), ...entry });
    saveLocal();
    renderContent();
  }

  async function removeEntry(id) {
    if (logsCol && !usingLocal) {
      try { await logsCol.doc(id).delete(); return; } catch (e) { /* fall through */ }
    }
    allEntries = allEntries.filter(e => e.id !== id);
    saveLocal();
    renderContent();
  }

  function entriesFor(dayId, itemId) {
    return allEntries.filter(e => e.dayId === dayId && e.itemId === itemId);
  }

  function renderFooterNote() {
    const el = document.getElementById("footer-note");
    el.textContent = usingLocal
      ? "Journal enregistré uniquement sur cet appareil (stockage synchronisé indisponible dans cette vue)."
      : "Ton journal est synchronisé automatiquement sur ton compte — accessible depuis n'importe quel appareil connecté.";
  }

  function escapeHtml(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function renderVideoLink(video) {

      <div class="video-demo" data-video-id="${video.id}">
        <img src="https://i.ytimg.com/vi/${video.id}/hqdefault.jpg" alt="Démonstration vidéo" class="video-thumb" loading="lazy">

    `;

  function renderChart(entries, kind, w, h) {
    const asc = entries.slice().sort((a, b) => a.date.localeCompare(b.date));
    const values = asc.map(e => e.value);
    const min = Math.min(...values), max = Math.max(...values);
    const range = max - min || 1;
    const padL = 34, padR = 10, padT = 12, padB = 10;
    const stepX = asc.length > 1 ? (w - padL - padR) / (asc.length - 1) : 0;
    const coords = asc.map((e, i) => ({
      x: padL + i * stepX,
      y: h - padB - ((e.value - min) / range) * (h - padT - padB)
    }));
    const points = coords.map(c => `${c.x},${c.y}`).join(" ");
    const areaPts = `${padL},${h - padB} ${points} ${coords[coords.length - 1].x},${h - padB}`;
    const unit = kind === "muscu" ? "kg" : "min";
    return `
      <div class="chart-wrap">
        <svg viewBox="0 0 ${w} ${h}" class="chart-svg" preserveAspectRatio="none">
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h - padB}" style="stroke:var(--line);stroke-width:1"></line>
          <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" style="stroke:var(--line);stroke-width:1"></line>
          <text x="4" y="${padT + 4}">${max}${unit}</text>
          <text x="4" y="${h - padB}">${min}${unit}</text>
          <polygon points="${areaPts}" style="fill:var(--amber);opacity:0.12"></polygon>
          <polyline points="${points}" style="fill:none;stroke:var(--amber);stroke-width:2.5"></polyline>
          ${coords.map(c => `<circle cx="${c.x}" cy="${c.y}" r="3.5" style="fill:var(--amber)"></circle>`).join("")}
        </svg>
        <p class="chart-caption">Évolution du ${kind === "muscu" ? "poids" : "temps"} — ${formatDateFR(asc[0].date)} → ${formatDateFR(asc[asc.length - 1].date)}</p>
      </div>
    `;
  }

  function renderHistoryTable(entries, kind) {
    const sorted = entries.slice().sort((a, b) => b.date.localeCompare(a.date));
    const rows = sorted.map(e => `
      <tr>
        <td class="num">${formatDateFR(e.date)}</td>
        <td class="num">${e.value}${kind === "muscu" ? " kg" : " min"}</td>
        ${kind === "muscu" ? `<td class="num">${e.reps ? escapeHtml(e.reps) : "—"}</td>` : ""}
        <td>${e.note ? escapeHtml(e.note) : "—"}</td>
        <td><button type="button" class="del-btn" data-del-id="${e.id}" title="Supprimer">✕</button></td>
      </tr>
    `).join("");
    return `
      <table class="log-table">
        <tr><th>Date</th><th>${kind === "muscu" ? "Poids" : "Durée"}</th>${kind === "muscu" ? "<th>Reps</th>" : ""}<th>Note</th><th></th></tr>
        ${rows}
      </table>
    `;
  }

  function renderLogSection(dayId, itemId, kind) {
    const entries = entriesFor(dayId, itemId);
    const base = slug(dayId + "-" + itemId);
    const valueLabel = kind === "muscu" ? "Poids (kg)" : "Durée (min)";
    return `
      <div class="log-section">
        <h4>Ton journal</h4>
        <form class="log-form" data-day="${dayId}" data-item="${itemId.replace(/"/g, "&quot;")}">
          <div class="log-row">
            <label for="${base}-date">Date<input id="${base}-date" type="date" name="date" value="${todayStr()}" required></label>
            <label for="${base}-value">${valueLabel}<input id="${base}-value" type="number" step="0.5" min="0" name="value" required></label>
            ${kind === "muscu" ? `<label for="${base}-reps">Reps<input id="${base}-reps" type="text" name="reps" placeholder="12,11,10,9"></label>` : ""}
          </div>
          <label class="log-note" for="${base}-note">Note (optionnel)<input id="${base}-note" type="text" name="note" placeholder="ressenti, douleur, énergie..."></label>
          <button type="submit" class="log-submit">Ajouter au journal</button>
        </form>
        ${entries.length ? renderHistoryTable(entries, kind) : `<p class="log-empty">Pas encore d'entrée — enregistre ta première séance ci-dessus.</p>`}
        ${entries.length >= 2 ? renderChart(entries, kind, 320, 90) : ""}
      </div>
    `;
  }

  // ---------- Jours muscu / cardio / repos ----------

  function renderExerciseCard(day, ex, idx) {
    const today = todayStr();
    const doneToday = entriesFor(day.id, ex.name).some(e => e.date === today);
    return `
      <div class="exercise ${doneToday ? "done" : ""}">
        <div class="ex-head" data-toggle="${idx}">
          <div class="ex-title-wrap">
            <p class="ex-name">${ex.name}${doneToday ? '<span class="chip chip-done">✓ fait</span>' : ""}</p>
            <p class="ex-spec">${ex.sets} · ${ex.weight}</p>
            <span class="chip chip-muscle">${ex.muscle}</span>
          </div>
          <span class="chevron" data-chevron="${idx}">▶</span>
        </div>
        <div class="ex-body" data-body="${idx}">
          <h4>Comment faire</h4>
          <ol>${ex.steps.map(s => `<li>${s}</li>`).join("")}</ol>
          ${renderVideoLink(ex.video)}
          ${ex.tip ? `<div class="tip-box">💡 <strong>Astuce :</strong> ${ex.tip}</div>` : ""}
          ${ex.mistake ? `<div class="mistake-box">⚠️ <strong>Erreur à éviter :</strong> ${ex.mistake}</div>` : ""}
          ${renderLogSection(day.id, ex.name, "muscu")}
        </div>
      </div>
    `;
  }

  function renderMuscuDay(day) {
    const cards = day.exercises.map((ex, i) => renderExerciseCard(day, ex, i)).join("");
    const finisherCard = day.finisher ? renderExerciseCard(day, day.finisher, day.exercises.length) : "";
    return `
      <div class="day-head">
        <span class="eyebrow strength">Musculation</span>
        <h2>${day.label} — ${day.title}</h2>
        <p class="sub">Touche un exercice pour voir la démo et enregistrer ta séance.</p>
      </div>
      ${cards}${finisherCard}
    `;
  }

  function renderCardioDay(day) {
    return `
      <div class="day-head">
        <span class="eyebrow cardio">Cardio</span>
        <h2>${day.label} — ${day.title}</h2>
        <p class="sub mono">${day.spec}</p>
      </div>
      <div class="panel">
        <p>${day.description}</p>
        <div class="tip-box">🎯 <strong>Pourquoi cette séance :</strong> ${day.why}</div>
      </div>
      <div class="panel">${renderLogSection(day.id, "session", "cardio")}</div>
    `;
  }

  function renderRestDay(day) {
    return `
      <div class="day-head">
        <span class="eyebrow rest">Repos</span>
        <h2>${day.label}</h2>
      </div>
      <div class="panel">
        <p>${day.description}</p>
        <div class="tip-box">🎯 <strong>Pourquoi ce jour compte :</strong> ${day.why}</div>
      </div>
    `;
  }

  // ---------- Journal ----------

  function renderJournal() {
    if (!allEntries.length) {
      return `
        <div class="day-head"><span class="eyebrow rest">Historique</span><h2>Journal de bord</h2></div>
        <div class="panel"><p>Ton journal est vide pour l'instant. Enregistre tes séances depuis les onglets des jours pour les voir apparaître ici, classées par date.</p></div>
      `;
    }
    const withMeta = allEntries.map(e => ({
      ...e,
      meta: (EXERCISE_INDEX[e.dayId] && EXERCISE_INDEX[e.dayId][e.itemId]) || { name: e.itemId, kind: "muscu", dayLabel: e.dayId }
    }));
    withMeta.sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
    const byDate = {};
    withMeta.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
    const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
    return `
      <div class="day-head">
        <span class="eyebrow rest">Historique</span>
        <h2>Journal de bord</h2>
        <p class="sub">Toutes tes séances enregistrées, de la plus récente à la plus ancienne.</p>
      </div>
      ${dates.map(date => `
        <div class="journal-date">
          <h3>${formatDateFR(date)}</h3>
          ${byDate[date].map(e => `
            <div class="journal-entry">
              <div class="journal-entry-head">
                <span class="day-tag">${e.meta.dayLabel}</span>
                <strong>${e.meta.name}</strong>
                <span class="journal-value">${e.value}${e.meta.kind === "muscu" ? "kg" : "min"}${e.reps ? " · " + escapeHtml(e.reps) + " reps" : ""}</span>
              </div>
              ${e.note ? `<p class="journal-note">${escapeHtml(e.note)}</p>` : ""}
            </div>
          `).join("")}
        </div>
      `).join("")}
    `;
  }

  // ---------- Progression ----------

  let currentProgressionKey = null;

  function progressionOptions() {
    const options = [];
    DAYS.forEach(day => {
      if (day.type === "muscu") {
        const all = day.finisher ? [...day.exercises, day.finisher] : day.exercises;
        all.forEach(ex => options.push({ dayId: day.id, itemId: ex.name, label: `${day.label} — ${ex.name}` }));
      } else if (day.type === "cardio") {
        options.push({ dayId: day.id, itemId: "session", label: `${day.label} — ${day.title}` });
      }
    });
    return options;
  }

  function renderProgressionTab() {
    const options = progressionOptions();
    const key = currentProgressionKey || `${options[0].dayId}::${options[0].itemId}`;
    const [curDay, curItem] = key.split("::");
    const kind = EXERCISE_INDEX[curDay][curItem].kind;
    const entries = entriesFor(curDay, curItem);
    return `
      <div class="day-head">
        <span class="eyebrow rest">Analyse</span>
        <h2>Progression</h2>
        <p class="sub">Choisis un exercice pour voir son évolution dans le temps.</p>
      </div>
      <select id="progression-select" class="progression-select">
        ${options.map(o => `<option value="${o.dayId}::${o.itemId}" ${`${o.dayId}::${o.itemId}` === key ? "selected" : ""}>${o.label}</option>`).join("")}
      </select>
      ${entries.length >= 2
        ? `<div class="panel">${renderChart(entries, kind, 600, 200)}</div>`
        : `<div class="panel"><p>Pas encore assez de données (il faut au moins 2 séances enregistrées). ${entries.length === 1 ? "Tu en as 1 pour l'instant." : "Enregistre tes séances depuis l'onglet du jour correspondant."}</p></div>`
      }
      ${entries.length ? `<div class="panel">${renderHistoryTable(entries, kind)}</div>` : ""}
    `;
  }

  // ---------- Navigation ----------

  let currentDayId = INTRO.id;
  const openExercises = new Set();

  function renderTabs() {
    const tabsEl = document.getElementById("tabs");
    tabsEl.innerHTML = DAYS.map(d => `<button type="button" class="tab-btn ${d.id === currentDayId ? "active" : ""}" data-day="${d.id}">${d.label}</button>`).join("");
    tabsEl.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentDayId = btn.dataset.day;
        renderTabs();
        renderContent();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function attachInteractions(contentEl, day) {
    contentEl.querySelectorAll(".video-play-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const wrap = btn.closest(".video-demo");
        const id = wrap.dataset.videoId;
        wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" title="Démonstration vidéo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
      });
    });
    contentEl.querySelectorAll(".log-form").forEach(form => {
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const data = new FormData(form);
        addEntry({
          dayId: form.dataset.day,
          itemId: form.dataset.item,
          date: data.get("date"),
          value: parseFloat(data.get("value")),
          reps: data.get("reps") || "",
          note: data.get("note") || "",
          ts: Date.now()
        });
      });
    });
    contentEl.querySelectorAll("[data-del-id]").forEach(btn => {
      btn.addEventListener("click", () => removeEntry(btn.dataset.delId));
    });
  }

  function renderContent() {
    const day = DAYS.find(d => d.id === currentDayId);
    const contentEl = document.getElementById("content");

    if (day.type === "intro") { contentEl.innerHTML = renderIntro(); return; }
    if (day.type === "glossaire") { contentEl.innerHTML = renderGlossary(); return; }
    if (day.type === "journal") { contentEl.innerHTML = renderJournal(); attachInteractions(contentEl, day); return; }
    if (day.type === "progression") {
      contentEl.innerHTML = renderProgressionTab();
      const sel = document.getElementById("progression-select");
      if (sel) sel.addEventListener("change", (e) => { currentProgressionKey = e.target.value; renderContent(); });
      return;
    }
    if (day.type === "cardio") { contentEl.innerHTML = renderCardioDay(day); attachInteractions(contentEl, day); return; }
    if (day.type === "repos") { contentEl.innerHTML = renderRestDay(day); return; }

    contentEl.innerHTML = renderMuscuDay(day);
    contentEl.querySelectorAll("[data-toggle]").forEach(head => {
      const idx = head.dataset.toggle;
      const key = `${day.id}:${idx}`;
      const body = contentEl.querySelector(`[data-body="${idx}"]`);
      const chevron = contentEl.querySelector(`[data-chevron="${idx}"]`);
      if (openExercises.has(key)) { body.classList.add("open"); chevron.classList.add("open"); }
      head.addEventListener("click", () => {
        body.classList.toggle("open");
        chevron.classList.toggle("open");
        if (body.classList.contains("open")) openExercises.add(key); else openExercises.delete(key);
      });
    });
    attachInteractions(contentEl, day);
  }

  function start() {
    renderTabs();
    renderContent();
    initStore();
  }

  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(start);
  } else {
    start();
  }
})();
</script>
